<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RChatAI 냉동 설계</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 머리 한 줄(대표 11/28 「이 부분이 차지하는 영역이 넓다」): 제목 · 가운데 탭(부품 검색|설계|견적) · 오른쪽 사용 안내·처음부터 -->
  <header class="top">
    <div class="title">냉동 설계</div>
    <div id="tabsbar" class="tabsbar"></div>
    <div class="topr">
      <div id="status" class="status"></div>
      <button id="tour-start" class="txtbtn" type="button" title="입력할 칸을 차례로 비춰 드려요" aria-label="사용 안내"></button>
      <button id="reset-all" class="txtbtn" type="button" title="처음부터" aria-label="처음부터"></button>
    </div>
  </header>
  <!-- 대표 11/08 그림: 입력 · 시각화 · 결과 (11/10 순서) · 채팅은 오른쪽 아래 단추로 여는 팝업(11/12) -->
  <div class="body">
    <main id="main" class="main"><div id="view" class="column"></div></main>
    <div class="gutter" role="separator" aria-orientation="vertical" title="끌어서 폭 조절 · 두 번 누르면 처음 폭"></div>
    <section id="viz" class="viz" aria-label="시각화"></section>
    <div class="gutter" role="separator" aria-orientation="vertical" title="끌어서 폭 조절 · 두 번 누르면 처음 폭"></div>
    <aside id="side" class="side"></aside>
  </div>
</div>
<!-- 채팅 — 오른쪽 아래 떠 있는 단추, 누르면 팝업 창(대표 11/12). 머리를 끌어 옮기고 가장자리·모서리를 끌어 크기 조절 -->
  <aside id="chat" class="chat float" hidden aria-label="채팅">
    <div class="chathead" title="끌어서 옮기기 · 가장자리를 끌어 크기 조절"><span class="ttl">채팅</span><button type="button" id="chat-share" aria-label="대화 전체 공유" title="대화 전체 공유" aria-haspopup="menu" aria-expanded="false"></button><button type="button" id="chat-close" aria-label="채팅 닫기"></button></div>
    <!-- 대화 전체 공유(대표 11/12) — 복사 · 텍스트 파일 · 다른 앱으로(브라우저가 지원할 때만) -->
    <div id="chat-sharemenu" class="sharemenu" role="menu" hidden>
      <button type="button" role="menuitem" data-share="copy">대화 전체 복사</button>
      <button type="button" role="menuitem" data-share="file">텍스트 파일로 저장</button>
      <button type="button" role="menuitem" data-share="native" hidden>다른 앱으로 공유…</button>
    </div>
    <div id="msgs" class="msgs"></div>
    <form id="chat-form" class="inputbar">
      <!-- 첨부 줄 — 라이브 앱과 같은 자리(입력줄 바로 위): 담으면 여기 쌓이고 [보내기]로 함께 나간다 -->
      <div id="chat-att" class="attrow" hidden></div>
      <div id="chat-attnote" class="attnote" role="status" hidden></div>
      <input type="file" id="chat-file" multiple hidden accept="image/*,.pdf,.xlsx,.xls,.xlsm,.csv,.tsv,.txt,.md,.json">
      <div class="inputpill">
        <button type="button" id="chat-add" class="pillbtn" aria-label="사진·파일 첨부" title="사진·파일 첨부 (붙여넣기·끌어 놓기도 돼요)" hidden></button>
        <textarea id="chat-input" rows="1" placeholder="메시지 입력" aria-label="메시지 입력"></textarea>
        <button type="button" id="chat-mic" class="pillbtn" aria-label="음성으로 입력" hidden></button>
        <!-- [새 상담] — 마이크 오른쪽(대표 11/10). 대화만 비우고 설계 값은 그대로 -->
        <button type="button" id="chat-new" class="pillbtn" aria-label="새 상담 시작" title="새 상담" disabled></button>
        <button type="submit" id="chat-send" class="send" aria-label="보내기" hidden></button>
      </div>
    </form>
  </aside>
<!-- 새 창고 시작 창(대표 11/14 「쿨셀렉터처럼 새 창고마다 마법사/수동 고르기」) — 처음 들어올 때·「처음부터」 때만, 새로고침엔 안 뜸 -->
<div id="startpick" class="startpick" hidden role="dialog" aria-modal="true" aria-labelledby="sp-t">
  <div class="sp-card">
    <div class="sp-t" id="sp-t">새 창고 설계</div>
    <div class="sp-d">부하계산부터 압축기·유니트·유닛쿨러·팽창변을 거쳐 견적까지 이어집니다. 가진 압축기가 있으면 압축기부터 정해도 됩니다.</div>
    <button type="button" class="sp-opt main" data-start="tour"><span class="t">안내 받으며 시작</span><span class="s">넣을 칸을 차례로 비춰 드려요 · 처음이면 권해요</span></button>
    <button type="button" class="sp-opt" data-start="comp"><span class="t">압축기부터 시작</span><span class="s">압축기를 정하면 가능한 창고 크기·온도를 찾아 드려요</span></button>
    <button type="button" class="sp-opt" data-start="direct"><span class="t">바로 입력</span><span class="s">안내 없이 화면으로 — 「사용 안내」는 언제든 위에서</span></button>
    <label class="sp-chk"><input type="checkbox" id="sp-noask"> 다음부터 묻지 않기</label>
  </div>
</div>
<!-- 사용 안내(대표 11/13 「모션 넣어 단계별로 입력 칸 하이라이트 + 간단 설명」) — 실제 화면의 칸을 차례로 비춘다 -->
<div id="tour" class="tour" hidden>
  <div class="tour-spot"></div>
  <div class="tour-bub" role="dialog" aria-live="polite">
    <div class="tour-stage"></div><div class="tour-step"></div><div class="tour-t"></div><div class="tour-d"></div>
    <div class="tour-btns"><button type="button" class="tour-skip">건너뛰기</button><span class="grow"></span><button type="button" class="tour-prev">이전</button><button type="button" class="tour-next">다음</button></div>
  </div>
</div>
<button type="button" id="chat-fab" class="chatfab" aria-controls="chat" aria-expanded="false" aria-label="채팅 열기"></button>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
